[project]
name = "meat-price-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "playwright>=1.48",
    "aiosqlite>=0.20",
    "pgeocode>=0.5",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "aiolimiter>=1.2",
    "tenacity>=9.0",
    "cryptography>=43",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
